baseURL = 'https://akitoyamashita.github.io/'
locale = 'ja-jp'
defaultContentLanguage = 'ja'
title = "AkitoYamashita.github.io"

enableGitInfo = true

[markup.goldmark.renderer]
unsafe = true

[[module.mounts]]
source = "../content"
target = "content"
files = [
    "! draft/**"
]

[params.sidebar]
expand = [
    # "doc",
    # "log",
    "note",
    "link",
]
exclude = ["page"]

[params.sidebar.links]
# 内部リンクは先頭にアンダーバーをつける(_blankにしない)
_profile = "/page/201204010101-profile/"
gist = "https://gist.github.com/AkitoYamashita"
github = "https://github.com/AkitoYamashita"
repo = "https://github.com/AkitoYamashita/AkitoYamashita.github.io/"
version = "https://akitoyamashita.github.io/version.txt"