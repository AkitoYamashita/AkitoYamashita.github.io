baseURL = 'https://akitoyamashita.github.io/'
locale = 'ja-jp'
defaultContentLanguage = 'ja'
title = "AkitoYamashita.github.io"

enableGitInfo = true

[markup.goldmark.renderer]
unsafe = true

# [[module.mounts]]
# source = "content"
# target = "content"

[[module.mounts]]
source = "../markdown"
target = "content"
files = [
    "! draft/**"
]

[params.sidebar]
closed = [
    "log",
    "log/2023",
    "log/2024",
    "note/archive",
    "note/aws",
]
