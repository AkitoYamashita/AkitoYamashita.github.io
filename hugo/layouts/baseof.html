<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ partial "title.html" . }} | {{ .Site.Title }}{{ end }}</title>
	<script>(function(){var t=localStorage.getItem('theme');if(t==='light'){document.documentElement.setAttribute('data-theme','light');}})();</script>
	<link href="{{ "/style.css" | relURL }}" rel="stylesheet">
	<link href="{{ "/pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">
	<script src="{{ "/pagefind/pagefind-ui.js" | relURL }}" defer></script>
</head>
<body>
	<header>
		<button id="toggle" aria-label="サイドバーの開閉" title="サイドバーの開閉">
			<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
				<rect x="1" y="2.5" width="14" height="11" rx="1.5"/>
				<line x1="6" y1="2.5" x2="6" y2="13.5"/>
			</svg>
		</button>
		<a href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
		<div id="search"></div>
		<button id="theme" aria-label="テーマの切り替え" title="テーマの切り替え">
			<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
				<circle cx="8" cy="8" r="3.5"/>
				<path d="M8 .5v2M8 13.5v2M.5 8h2M13.5 8h2M2.7 2.7l1.4 1.4M11.9 11.9l1.4 1.4M13.3 2.7l-1.4 1.4M4.1 11.9l-1.4 1.4"/>
			</svg>
		</button>
	</header>
	<div class="layout">
		<nav>{{ partial "sidebar.html" (dict "dirs" (partial "dirs.html" .) "parent" "" "depth" 0) }}</nav>
		<main data-pagefind-body>{{ block "main" . }}{{ end }}</main>
	</div>
	<script>
	document.addEventListener('DOMContentLoaded', function () {
		if (window.PagefindUI) { new PagefindUI({ element: "#search", showSubResults: true }); }
		var b = document.body, t = document.getElementById('toggle'), h = document.documentElement;
		if (localStorage.getItem('nav') === 'closed') { b.classList.add('nav-closed'); }
		t.addEventListener('click', function () {
			b.classList.toggle('nav-closed');
			localStorage.setItem('nav', b.classList.contains('nav-closed') ? 'closed' : 'open');
		});
		document.getElementById('theme').addEventListener('click', function () {
			var light = h.getAttribute('data-theme') === 'light';
			if (light) { h.removeAttribute('data-theme'); localStorage.setItem('theme', 'dark'); }
			else { h.setAttribute('data-theme', 'light'); localStorage.setItem('theme', 'light'); }
		});
	});
	</script>
</body>
</html>
